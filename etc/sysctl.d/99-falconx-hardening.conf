# FALCON-X Kernel Hardening — sysctl settings
# Applied via /etc/sysctl.d/99-falconx-hardening.conf

# ── ASLR and Memory Protection ────────────────────────────────────
# Full ASLR randomization
kernel.randomize_va_space = 2

# Restrict dmesg to root
kernel.dmesg_restrict = 1

# Restrict kernel pointer exposure
kernel.kptr_restrict = 2

# Hide kernel symbols
kernel.kexec_load_disabled = 1

# Restrict perf_event access
kernel.perf_event_paranoid = 3

# Restrict userfaultfd
vm.unprivileged_userfaultfd = 0

# ── Network Security ──────────────────────────────────────────────
# Disable IP forwarding by default (gateway mode enables it)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable secure ICMP redirects
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Log Martian packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP broadcast requests
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP errors
net.ipv4.icmp_ignore_bogus_error_responses = 1

# SYN flood protection
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

# Reverse path filtering
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable IPv6 if not needed (re-enable if Wi-Fi IPv6 required)
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1

# ── Connection Tracking ───────────────────────────────────────────
# Reduce conntrack timeout for ephemeral connections
net.netfilter.nf_conntrack_tcp_timeout_established = 43200
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30

# ── TCP Hardening ─────────────────────────────────────────────────
# Reduce TIME_WAIT
net.ipv4.tcp_fin_timeout = 15

# Reuse TIME_WAIT sockets
net.ipv4.tcp_tw_reuse = 1

# Don't create route cache
net.ipv4.route.gc_thresh = 0

# ── File System ───────────────────────────────────────────────────
# Restrict sysrq
kernel.sysrq = 0

# Restrict core dumps
fs.suid_dumpable = 0

# Increase file handle limit
fs.file-max = 2097152

# ── Unprivileged subsystem restrictions ───────────────────────────
# Restrict BPF
kernel.unprivileged_bpf_disabled = 1

# Restrict user namespaces (may break some containers)
# kernel.unprivileged_userns_clone = 0

# Restrict TTY device access
dev.tty.ldisc_autoload = 0

# Restrict loading of kernel modules after boot
# Note: Set to 1 only after all required modules are loaded
# kernel.modules_disabled = 0
