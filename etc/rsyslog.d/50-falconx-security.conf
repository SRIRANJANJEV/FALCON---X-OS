# FALCON-X Protected Security Logging Configuration
# rsyslog rules for security event logging

# ── Auth logging ──────────────────────────────────────────────────
# Log all authentication events
auth,authpriv.*                 /var/log/falconx/security/auth.log

# ── Firewall logging ──────────────────────────────────────────────
# nftables log messages
:msg,contains, "[FALCONX-DROP]" /var/log/falconx/security/firewall.log
:msg,contains, "[FALCONX-OUT]" /var/log/falconx/security/firewall.log
:msg,contains, "[FALCONX-GW-DROP]" /var/log/falconx/security/firewall.log
:msg,contains, "[FALCONX-FWD-DROP]" /var/log/falconx/security/firewall.log

# ── Service failures ──────────────────────────────────────────────
# systemd service failures
:msg,contains, "falconx-engine" /var/log/falconx/security/services.log
:msg,contains, "falconx-web" /var/log/falconx/security/services.log
:msg,contains, "falconx-health" /var/log/falconx/security/services.log
:msg,contains, "falconx-enforcer" /var/log/falconx/security/services.log

# ── Configuration changes ─────────────────────────────────────────
# Log su/sudo usage
authpriv.notice                  /var/log/falconx/security/config-changes.log

# ── Boot events ───────────────────────────────────────────────────
kern.*                          /var/log/falconx/security/boot.log
*.emerg                         /var/log/falconx/security/emergency.log

# ── General system log ────────────────────────────────────────────
*.*;auth,authpriv.none          /var/log/falconx/security/system.log

# ── Discard duplicate messages ────────────────────────────────────
& ~
