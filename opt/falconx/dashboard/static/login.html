<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FALCON-X — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e17;color:#e0e6ed;display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:40px;width:360px}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:24px;color:#00d4ff;letter-spacing:4px}
.logo p{color:#6b7280;font-size:12px;margin-top:4px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:#9ca3af;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.form-group input{width:100%;padding:12px;background:#0a0e17;border:1px solid #1f2937;border-radius:8px;color:#e0e6ed;font-size:14px;outline:none;transition:border 0.2s}
.form-group input:focus{border-color:#00d4ff}
.btn{width:100%;padding:12px;background:#00d4ff;color:#0a0e17;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
.error{color:#ef4444;font-size:13px;margin-top:12px;display:none;text-align:center}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <h1>FALCON-X</h1>
    <p>Security Appliance Dashboard</p>
  </div>
  <form id="loginForm">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const err=document.getElementById('error');
  err.style.display='none';
  try{
    const resp=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const data=await resp.json();
    if(data.success){
      if(data.csrf_token){localStorage.setItem('falconx_csrf',data.csrf_token)}
      window.location.href='/dashboard'
    }
    else{err.textContent=data.error||'Login failed';err.style.display='block'}
  }catch(ex){err.textContent='Connection error';err.style.display='block'}
});
</script>
</body>
</html>
